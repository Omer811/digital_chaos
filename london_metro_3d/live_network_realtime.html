<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>London Network Realtime 3D</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root {
      --bg0: #060910;
      --bg1: #0b1020;
      --bg2: #17243d;
      --panel: rgba(15, 23, 42, 0.84);
      --ink: #e2e8f0;
      --muted: #94a3b8;
      --line: rgba(148,163,184,0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Space Grotesk", system-ui, sans-serif;
      background: radial-gradient(1200px 900px at 10% 10%, var(--bg2) 0%, var(--bg1) 55%, var(--bg0) 100%);
    }
    .app { display: grid; grid-template-columns: 360px 1fr; gap: 12px; height: 100vh; padding: 12px; }
    .panel {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: var(--panel);
      backdrop-filter: blur(8px);
      overflow: auto;
    }
    .viz {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: linear-gradient(150deg, #0b1221 0%, #060910 100%);
    }
    .row { display: grid; gap: 6px; margin-bottom: 10px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    input, button {
      width: 100%;
      background: rgba(17,24,39,0.95);
      color: var(--ink);
      border: 1px solid rgba(100,116,139,0.45);
      border-radius: 8px;
      padding: 8px;
    }
    button { cursor: pointer; font-weight: 600; }
    #status {
      white-space: pre-line;
      color: var(--muted);
      font-size: 12px;
      border: 1px solid rgba(100,116,139,0.35);
      padding: 8px;
      border-radius: 8px;
      background: rgba(15,23,42,0.45);
    }
    #plot { width: 100%; height: 100%; }
    @media (max-width: 980px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <section class="panel">
      <div class="row">
        <label>Live State JSON URL</label>
        <input id="liveStateUrl" value="../output/london_metro_3d/live_realtime/live_state.json" />
      </div>
      <div class="row2">
        <div class="row">
          <label>Refresh (ms)</label>
          <input id="refreshMs" type="number" value="1000" min="250" step="250" />
        </div>
        <div class="row">
          <label>Train Size</label>
          <input id="markerSize" type="number" value="4" min="1" step="0.5" />
        </div>
      </div>
      <div class="row2">
        <div class="row">
          <label>Frame Delay (ms)</label>
          <input id="delayMs" type="number" value="1200" min="0" step="100" />
        </div>
        <div class="row">
          <label>Interpolation (ms)</label>
          <input id="interpMs" type="number" value="1400" min="50" step="50" />
        </div>
      </div>
      <div class="row2">
        <button id="startBtn">Start Live</button>
        <button id="stopBtn">Stop</button>
      </div>
      <div id="status">Idle. Start live polling.</div>
    </section>
    <section class="viz"><div id="plot"></div></section>
  </div>

  <script>
    const el = (id) => document.getElementById(id);
    const state = {
      timer: null,
      raf: null,
      queue: [],
      lastFetchedSnapshot: null,
      current: null,
      next: null,
      segmentStartMs: 0,
      segByLine: new Map(),
      camera: null,
      trainTraceIndex: -1,
      initialized: false,
      plotListenerAttached: false,
    };

    function lineColor(lineId) {
      const m = {
        bakerloo: '#B36305', central: '#E32017', circle: '#FFD300', district: '#00782A',
        'hammersmith-city': '#F3A9BB', jubilee: '#A0A5A9', metropolitan: '#9B0056',
        northern: '#d1d5db', piccadilly: '#003688', victoria: '#0098D4', 'waterloo-city': '#95CDBA'
      };
      return m[lineId] || '#34d399';
    }

    function resolveDataUrl(raw) {
      const s = String(raw || '').trim();
      if (!s) return '';
      if (/^https?:\/\//i.test(s) || s.startsWith('/')) return s;
      if (s.startsWith('output/')) return `../${s}`;
      return s;
    }

    function setStatus(msg) { el('status').textContent = msg; }

    function buildSegmentIndex(edges) {
      const m = new Map();
      for (const e of (edges || [])) {
        const lid = e.line_id || 'unknown';
        if (!m.has(lid)) m.set(lid, []);
        m.get(lid).push({ x1: e.lon1, y1: e.lat1, x2: e.lon2, y2: e.lat2, z: e.z1 ?? -20 });
      }
      state.segByLine = m;
    }

    function nearestPointOnSegment(px, py, s) {
      const vx = s.x2 - s.x1;
      const vy = s.y2 - s.y1;
      const wx = px - s.x1;
      const wy = py - s.y1;
      const vv = vx * vx + vy * vy;
      const t = vv <= 1e-12 ? 0 : Math.max(0, Math.min(1, (wx * vx + wy * vy) / vv));
      const x = s.x1 + t * vx;
      const y = s.y1 + t * vy;
      const dx = px - x;
      const dy = py - y;
      return { x, y, z: s.z, d2: dx * dx + dy * dy };
    }

    function snapToLine(lineId, lon, lat, zFallback) {
      const segs = state.segByLine.get(lineId) || [];
      if (segs.length === 0) return { lon, lat, z: zFallback };
      let best = null;
      for (const s of segs) {
        const cand = nearestPointOnSegment(lon, lat, s);
        if (!best || cand.d2 < best.d2) best = cand;
      }
      return { lon: best.x, lat: best.y, z: best.z };
    }

    function trainKey(t) { return `${t.line_id}::${t.vehicle_id}`; }

    function interpolateTrainsOnLines(aFrame, bFrame, alpha) {
      const a = aFrame ? (aFrame.trains || []) : [];
      const b = bFrame ? (bFrame.trains || []) : [];
      const aMap = new Map(a.map((x) => [trainKey(x), x]));
      const bMap = new Map(b.map((x) => [trainKey(x), x]));
      const trains = [];
      for (const [k, nxt] of bMap.entries()) {
        const prv = aMap.get(k);
        if (prv && prv.line_id === nxt.line_id) {
          const rawLon = prv.lon + (nxt.lon - prv.lon) * alpha;
          const rawLat = prv.lat + (nxt.lat - prv.lat) * alpha;
          const snap = snapToLine(nxt.line_id, rawLon, rawLat, nxt.z);
          trains.push({ ...nxt, lon: snap.lon, lat: snap.lat, z: snap.z });
        } else {
          const snap = snapToLine(nxt.line_id, nxt.lon, nxt.lat, nxt.z);
          trains.push({ ...nxt, lon: snap.lon, lat: snap.lat, z: snap.z });
        }
      }
      return trains;
    }

    function buildStaticTraces(frame) {
      const traces = [];

      const grouped = new Map();
      for (const e of (frame.edges || [])) {
        if (!grouped.has(e.line_id)) grouped.set(e.line_id, []);
        grouped.get(e.line_id).push(e);
      }
      for (const [lineId, list] of grouped.entries()) {
        const x = [], y = [], z = [];
        for (const e of list) {
          x.push(e.lon1, e.lon2, null);
          y.push(e.lat1, e.lat2, null);
          z.push(e.z1, e.z2, null);
        }
        traces.push({
          type: 'scatter3d', mode: 'lines', x, y, z,
          line: { color: lineColor(lineId), width: 3 },
          opacity: 0.6,
          hoverinfo: 'skip',
          showlegend: false,
        });
      }

      traces.push({
        type: 'scatter3d', mode: 'markers',
        x: [], y: [], z: [],
        marker: { size: Number(el('markerSize').value || 4), color: [], opacity: 0.95 },
        text: [], hovertemplate: '%{text}<extra></extra>',
        showlegend: false,
      });
      state.trainTraceIndex = traces.length - 1;
      return traces;
    }

    function buildLayout(frame) {
      return {
        template: 'plotly_dark',
        title: `Live Network 3D | snapshot=${frame.snapshot_idx} | ${frame.captured_at_utc}`,
        margin: { l: 0, r: 0, t: 44, b: 0 },
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)',
        showlegend: false,
        uirevision: 'keep-camera',
        scene: {
          ...(state.camera ? { camera: state.camera } : {}),
          bgcolor: 'rgba(9,12,20,1)',
          xaxis: { visible: false, showgrid: false, zeroline: false, showticklabels: false, title: '' },
          yaxis: { visible: false, showgrid: false, zeroline: false, showticklabels: false, title: '' },
          zaxis: { visible: false, showgrid: false, zeroline: false, showticklabels: false, title: '' },
        },
      };
    }

    function initOrRefreshStatic(frame) {
      buildSegmentIndex(frame.edges || []);
      const traces = buildStaticTraces(frame);
      Plotly.react('plot', traces, buildLayout(frame), { responsive: true });
      if (!state.plotListenerAttached) {
        const plot = el('plot');
        plot.on('plotly_relayout', (ev) => {
          if (ev && ev['scene.camera']) state.camera = ev['scene.camera'];
        });
        state.plotListenerAttached = true;
      }
      state.initialized = true;
    }

    function updateTrains(trains) {
      const xs = [], ys = [], zs = [], colors = [], texts = [];
      const size = Number(el('markerSize').value || 4);
      for (const t of trains) {
        xs.push(t.lon); ys.push(t.lat); zs.push(t.z);
        colors.push(lineColor(t.line_id));
        texts.push(`${t.line_id} | ${t.vehicle_id} | ${t.station_name}`);
      }
      Plotly.restyle(
        'plot',
        {
          x: [xs],
          y: [ys],
          z: [zs],
          text: [texts],
          'marker.size': [size],
          'marker.color': [colors],
        },
        [state.trainTraceIndex]
      );
    }

    function updateStatus(frame) {
      const m = frame.meta || {};
      setStatus([
        `snapshot=${frame.snapshot_idx}`,
        `captured=${frame.captured_at_utc}`,
        `modes=${(frame.modes || []).join(',') || 'tube'}`,
        `lines=${m.line_count ?? 'n/a'}`,
        `arrivals_all=${m.arrivals_all_count ?? 'n/a'}`,
        `arrivals_filtered=${m.arrivals_filtered_count ?? 'n/a'}`,
        `trains_rendered=${m.trains_rendered_count ?? (frame.trains || []).length}`,
        `unique_vehicles=${m.unique_vehicle_count ?? 'n/a'}`,
      ].join('\n'));
    }

    function animationLoop(now) {
      if (!state.current && state.queue.length > 0) {
        state.current = state.queue.shift();
        initOrRefreshStatic(state.current);
        updateTrains(state.current.trains || []);
      }

      if (state.current && !state.next && state.queue.length > 0) {
        state.next = state.queue.shift();
        state.segmentStartMs = now;
      }

      if (state.current && state.next) {
        const duration = Math.max(50, Number(el('interpMs').value || 1400));
        const alpha = Math.max(0, Math.min(1, (now - state.segmentStartMs) / duration));
        const trains = interpolateTrainsOnLines(state.current, state.next, alpha);
        updateTrains(trains);
        updateStatus(state.next);
        if (alpha >= 1) {
          state.current = state.next;
          state.next = null;
        }
      } else if (state.current) {
        updateTrains(state.current.trains || []);
        updateStatus(state.current);
      }

      state.raf = requestAnimationFrame(animationLoop);
    }

    async function fetchFrameOnce() {
      const resolved = resolveDataUrl(el('liveStateUrl').value);
      if (!resolved) {
        setStatus('Missing live JSON URL.');
        return;
      }
      const url = `${resolved}${resolved.includes('?') ? '&' : '?'}t=${Date.now()}`;
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const payload = await r.json();
      if (state.lastFetchedSnapshot === payload.snapshot_idx) return;
      state.lastFetchedSnapshot = payload.snapshot_idx;
      state.queue.push(payload);

      const refresh = Math.max(250, Number(el('refreshMs').value || 1000));
      const delay = Math.max(0, Number(el('delayMs').value || 1200));
      const maxBuffered = Math.max(2, Math.floor(delay / refresh) + 2);
      while (state.queue.length > maxBuffered) state.queue.shift();
    }

    function start() {
      stop();
      fetchFrameOnce().catch((e) => setStatus(`Fetch error: ${e.message}`));
      const ms = Math.max(250, Number(el('refreshMs').value || 1000));
      state.timer = setInterval(() => {
        fetchFrameOnce().catch((e) => setStatus(`Fetch error: ${e.message}`));
      }, ms);
      if (!state.raf) state.raf = requestAnimationFrame(animationLoop);
    }

    function stop() {
      if (state.timer) {
        clearInterval(state.timer);
        state.timer = null;
      }
    }

    el('startBtn').addEventListener('click', start);
    el('stopBtn').addEventListener('click', stop);
    if (!state.raf) state.raf = requestAnimationFrame(animationLoop);
  </script>
</body>
</html>
