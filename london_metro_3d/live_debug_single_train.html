<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Single-Line Single-Train Debug</title>
  <style>
    :root { --bg:#0b1020; --panel:rgba(15,23,42,.86); --line:rgba(148,163,184,.35); --ink:#e2e8f0; --muted:#94a3b8; }
    *{box-sizing:border-box}
    body{margin:0;color:var(--ink);font-family:system-ui,sans-serif;background:radial-gradient(1200px 900px at 10% 10%, #17243d 0%, #0b1020 55%, #060910 100%)}
    .app{display:grid;grid-template-columns:340px 1fr;gap:12px;height:100vh;padding:12px}
    .panel{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel);backdrop-filter:blur(8px);overflow:auto}
    .viz{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:linear-gradient(150deg,#0b1221 0%,#060910 100%)}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
    .row{display:grid;gap:6px;margin-bottom:10px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    input,button{width:100%;background:rgba(17,24,39,.95);color:var(--ink);border:1px solid rgba(100,116,139,.45);border-radius:8px;padding:8px}
    button{cursor:pointer;font-weight:600}#status{white-space:pre-line;color:var(--muted);font-size:12px;border:1px solid rgba(100,116,139,.35);padding:8px;border-radius:8px;background:rgba(15,23,42,.45)}
    @media(max-width:980px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
  </style>
</head>
<body>
  <div class="app">
    <section class="panel">
      <div class="row">
        <label>Live Debug JSON URL</label>
        <input id="jsonUrl" value="../output/london_metro_3d/live_debug_single_train/live_debug_state.json" />
      </div>
      <div class="row2">
        <div class="row"><label>Refresh (ms)</label><input id="refreshMs" type="number" value="3000" min="250" step="50"/></div>
        <div class="row"><label>Render FPS</label><input id="renderFps" type="number" value="60" min="10" max="144" step="1"/></div>
      </div>
      <div class="row2">
        <div class="row"><label>Interpolation (ms)</label><input id="interpMs" type="number" value="1400" min="50" step="50"/></div>
        <div class="row"><label>Train Size</label><input id="trainSize" type="number" value="5" min="1" step="0.5"/></div>
      </div>
      <div class="row2">
        <div class="row"><label>Lookahead Frames</label><input id="lookaheadFrames" type="number" value="10" min="1" max="120" step="1"/></div>
        <div class="row"><label>No Backward Motion</label><input id="noBackward" type="checkbox" checked/></div>
      </div>
      <div class="row2">
        <div class="row"><label>Station Size</label><input id="stationSize" type="number" value="2.5" min="1" step="0.5"/></div>
        <div class="row"><label>Show Labels</label><input id="showLabels" type="checkbox"/></div>
      </div>
      <div class="row2">
        <div class="row"><label>Show Path</label><input id="showPath" type="checkbox"/></div>
        <div class="row"><label>Path Jump Threshold (px)</label><input id="pathJumpPx" type="number" value="120" min="20" step="10"/></div>
      </div>
      <div class="row2"><button id="startBtn">Start</button><button id="stopBtn">Stop</button></div>
      <div class="row2"><button id="resetBtn">Reset View</button><button id="reloadBtn">Reload Once</button></div>
      <div id="status">Idle.</div>
    </section>
    <section class="viz" id="viz"><canvas id="base"></canvas><canvas id="overlay"></canvas></section>
  </div>

  <script>
    const el=(id)=>document.getElementById(id);
    const viz=el('viz');
    const base=el('base'); const overlay=el('overlay');
    const bctx=base.getContext('2d'); const octx=overlay.getContext('2d');

    const state={
      timer:null, raf:null, queue:[], lastSnapshot:null,
      current:null, next:null, segStartMs:0, lastRenderTs:0,
      view:{zoom:1,panX:0,panY:0,drag:false,dx:0,dy:0},
      world:{minLon:-0.2,maxLon:0,minLat:51.4,maxLat:51.6},
      baseDirty:true,
      motion:{dirKey:null,lastT:null},
    };

    function status(s){el('status').textContent=s}
    function resolveUrl(raw){const s=String(raw||'').trim();if(!s)return'';if(/^https?:\/\//i.test(s)||s.startsWith('/'))return s;if(s.startsWith('output/'))return `../${s}`;return s;}

    function resize(){const r=viz.getBoundingClientRect();const dpr=window.devicePixelRatio||1;for(const c of [base,overlay]){c.width=Math.max(1,Math.floor(r.width*dpr));c.height=Math.max(1,Math.floor(r.height*dpr));}bctx.setTransform(dpr,0,0,dpr,0,0);octx.setTransform(dpr,0,0,dpr,0,0);state.baseDirty=true;}
    function resetView(){state.view.zoom=1;state.view.panX=0;state.view.panY=0;state.baseDirty=true;}

    function recomputeBounds(frame){
      let minLon=Infinity,maxLon=-Infinity,minLat=Infinity,maxLat=-Infinity;
      for(const e of (frame.edges||[])){minLon=Math.min(minLon,e.lon1,e.lon2);maxLon=Math.max(maxLon,e.lon1,e.lon2);minLat=Math.min(minLat,e.lat1,e.lat2);maxLat=Math.max(maxLat,e.lat1,e.lat2);}
      if(!Number.isFinite(minLon)) return;
      const mlon=(maxLon-minLon)*0.08, mlat=(maxLat-minLat)*0.08;
      state.world={minLon:minLon-mlon,maxLon:maxLon+mlon,minLat:minLat-mlat,maxLat:maxLat+mlat};
      state.baseDirty=true;
    }

    function proj(lon,lat){const r=viz.getBoundingClientRect();const pad=28;const w=Math.max(20,r.width-pad*2),h=Math.max(20,r.height-pad*2);const W=state.world;const x=pad+((lon-W.minLon)/Math.max(1e-9,W.maxLon-W.minLon))*w;const y=pad+(1-(lat-W.minLat)/Math.max(1e-9,W.maxLat-W.minLat))*h;return{x:x*state.view.zoom+state.view.panX,y:y*state.view.zoom+state.view.panY};}

    function drawBase(){if(!state.current||!state.baseDirty)return;const r=viz.getBoundingClientRect();bctx.clearRect(0,0,r.width,r.height);const g=bctx.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,'rgba(12,18,30,.95)');g.addColorStop(1,'rgba(6,9,16,.95)');bctx.fillStyle=g;bctx.fillRect(0,0,r.width,r.height);
      for(const e of (state.current.edges||[])){const a=proj(e.lon1,e.lat1),b=proj(e.lon2,e.lat2);bctx.strokeStyle='#00d1ff';bctx.lineWidth=2.6;bctx.globalAlpha=.9;bctx.beginPath();bctx.moveTo(a.x,a.y);bctx.lineTo(b.x,b.y);bctx.stroke();}
      const stMap=new Map();for(const s of (state.current.stations||[])){if(s&&s.station_id)stMap.set(String(s.station_id),s);}
      const stationSize=Math.max(1,Number(el('stationSize').value||2.5));const labels=!!el('showLabels').checked;
      bctx.globalAlpha=.95;bctx.fillStyle='rgba(226,232,240,.95)';bctx.strokeStyle='rgba(15,23,42,.95)';bctx.lineWidth=1;bctx.font='10px system-ui';
      for(const s of stMap.values()){const p=proj(Number(s.lon),Number(s.lat));bctx.beginPath();bctx.arc(p.x,p.y,stationSize,0,Math.PI*2);bctx.fill();bctx.stroke();if(labels){const name=String(s.station_name||'');bctx.fillStyle='rgba(226,232,240,.95)';bctx.fillText(name,p.x+4,p.y-4);}}
      const samples=state.current.samples||[];
      if(!!el('showPath').checked && samples.length>1){
        bctx.strokeStyle='rgba(249,115,22,.45)';bctx.lineWidth=1.5;bctx.beginPath();
        const jumpPx=Math.max(20,Number(el('pathJumpPx').value||120));
        let prev=proj(samples[0].lon,samples[0].lat);bctx.moveTo(prev.x,prev.y);
        for(let i=1;i<samples.length;i++){
          const cur=samples[i], prv=samples[i-1];
          const p=proj(cur.lon,cur.lat);
          const segChanged=(String(cur.segment_from||'')!==String(prv.segment_from||''))||(String(cur.segment_to||'')!==String(prv.segment_to||''));
          const d=Math.hypot(p.x-prev.x,p.y-prev.y);
          if(segChanged||d>jumpPx){bctx.moveTo(p.x,p.y);}else{bctx.lineTo(p.x,p.y);}
          prev=p;
        }
        bctx.stroke();
      }
      bctx.globalAlpha=1;state.baseDirty=false;}

    function sampleAt(frame,alpha){
      const cur=frame.sample; if(!cur) return null;
      if(!state.current||!state.next||!state.current.sample||!state.next.sample) return cur;
      const a=state.current.sample,b=state.next.sample;
      if(String(a.vehicle_id)!==String(b.vehicle_id)) return b;
      return {...b, lon:a.lon+(b.lon-a.lon)*alpha, lat:a.lat+(b.lat-a.lat)*alpha};
    }

    function stationByName(frame, name){
      const target=String(name||'').toLowerCase().trim();
      if(!target) return null;
      for(const s of (frame.stations||[])){
        const nm=String(s.station_name||'').toLowerCase().trim();
        if(nm===target) return s;
      }
      // fallback contains match
      for(const s of (frame.stations||[])){
        const nm=String(s.station_name||'').toLowerCase().trim();
        if(nm.includes(target)||target.includes(nm)) return s;
      }
      return null;
    }

    function constrainForward(sample, frame){
      if(!sample || !el('noBackward').checked) return sample;
      const from=sample.segment_from, to=sample.segment_to;
      if(!from || !to || from===to) return sample;
      const a=stationByName(frame, from), b=stationByName(frame, to);
      if(!a || !b) return sample;
      const ax=Number(a.lon), ay=Number(a.lat), bx=Number(b.lon), by=Number(b.lat);
      const vx=bx-ax, vy=by-ay;
      const vv=vx*vx+vy*vy;
      if(vv<=1e-12) return sample;
      let t=((sample.lon-ax)*vx+(sample.lat-ay)*vy)/vv;
      t=Math.max(0,Math.min(1,t));
      const dirKey=`${String(sample.vehicle_id)}|${String(from)}->${String(to)}`;
      if(state.motion.dirKey===dirKey && state.motion.lastT!=null && t<state.motion.lastT){
        t=state.motion.lastT;
      }
      state.motion.dirKey=dirKey;
      state.motion.lastT=t;
      return {...sample, lon:ax+vx*t, lat:ay+vy*t, constrained_t:t};
    }

    function drawTrain(s){const r=viz.getBoundingClientRect();octx.clearRect(0,0,r.width,r.height);if(!s)return;const p=proj(s.lon,s.lat);const sz=Math.max(1,Number(el('trainSize').value||5));octx.shadowBlur=14;octx.shadowColor='#f59e0b';octx.fillStyle='rgba(245,158,11,.35)';octx.beginPath();octx.arc(p.x,p.y,sz*1.8,0,Math.PI*2);octx.fill();octx.shadowBlur=0;octx.fillStyle='#f59e0b';octx.beginPath();octx.arc(p.x,p.y,sz,0,Math.PI*2);octx.fill();}

    function updateStatus(frame){const m=frame.meta||{};const poll=Math.max(250,Number(el('refreshMs').value||3000));const rpm=(60000/poll).toFixed(1);const lookahead=Math.max(1,Number(el('lookaheadFrames').value||10));const buffered=(state.current?1:0)+state.queue.length+(state.next?1:0);status([
      `line=${frame.line_id}`,
      `vehicle=${frame.vehicle_id||'n/a'}`,
      `snapshot=${frame.snapshot_idx}`,
      `captured=${frame.captured_at_utc}`,
      `pos_source=${(frame.sample||{}).position_source || 'n/a'}`,
      `stabilization_note=${(frame.sample||{}).stabilization_note || 'n/a'}`,
      `segment=${(frame.sample||{}).segment_from || 'n/a'} -> ${(frame.sample||{}).segment_to || 'n/a'}`,
      `raw_currentLocation=${(frame.sample||{}).raw_current_location || 'n/a'}`,
      `raw_station=${(frame.sample||{}).raw_station_name || 'n/a'} [${(frame.sample||{}).raw_station_id || 'n/a'}]`,
      `raw_destination=${(frame.sample||{}).destination_name || 'n/a'}`,
      `raw_platform=${(frame.sample||{}).platform_name || 'n/a'}`,
      `raw_direction=${(frame.sample||{}).tfl_direction || 'n/a'}`,
      `raw_tts=${(frame.sample||{}).raw_time_to_station_sec ?? 'n/a'}`,
      `filtered_tts=${(frame.sample||{}).time_to_station_sec ?? 'n/a'}`,
      `arrivals=${m.arrivals_count ?? 'n/a'}`,
      `mapped_points=${m.mapped_points ?? 'n/a'}`,
      `primary_vehicle_points=${m.primary_vehicle_points ?? 'n/a'}`,
      `poll_ms=${poll} (~${rpm} req/min)`,
      `render_fps=${Math.max(10,Number(el('renderFps').value||60))}`,
      `lookahead=${lookahead}`,
      `buffered_frames=${buffered}`,
    ].join('\n'));}

    function animate(ts){const fps=Math.max(10,Number(el('renderFps').value||60));const minDt=1000/fps;if(state.lastRenderTs&&(ts-state.lastRenderTs)<minDt){state.raf=requestAnimationFrame(animate);return;}state.lastRenderTs=ts;
      const lookahead=Math.max(1,Number(el('lookaheadFrames').value||10));
      if(!state.current && state.queue.length>=lookahead+1){state.current=state.queue.shift();recomputeBounds(state.current);state.baseDirty=true;state.motion={dirKey:null,lastT:null};console.log(`[Lookahead] ready: buffered=${state.queue.length+1} lookahead=${lookahead}`);}
      if(state.current&&!state.next&&state.queue.length>=1){state.next=state.queue[0];state.segStartMs=ts;recomputeBounds(state.next);state.baseDirty=true;}
      drawBase();
      if(state.current&&state.next){
        const dur=Math.max(50,Number(el('interpMs').value||1400));
        const a=Math.max(0,Math.min(1,(ts-state.segStartMs)/dur));
        const smp=constrainForward(sampleAt(state.next,a), state.next);
        drawTrain(smp);updateStatus(state.next);
        if(a>=1){state.current=state.queue.shift()||state.next;state.next=state.queue.length?state.queue[0]:null;state.segStartMs=ts;state.baseDirty=true;}
      } else if(state.current){
        const smp=constrainForward(sampleAt(state.current,1), state.current);
        drawTrain(smp);updateStatus(state.current);
      } else if(state.queue.length>0){
        const have=state.queue.length;
        const need=lookahead+1;
        status(`Buffering lookahead frames...\n${have}/${need} frames ready\nwaiting for ${Math.max(0,need-have)} more frame(s)`);
      }
      state.raf=requestAnimationFrame(animate);}

    async function fetchOnce(){const u=resolveUrl(el('jsonUrl').value);if(!u)return;const r=await fetch(`${u}${u.includes('?')?'&':'?'}t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const frame=await r.json();if(state.lastSnapshot===frame.snapshot_idx)return;state.lastSnapshot=frame.snapshot_idx;state.queue.push(frame);const lookahead=Math.max(1,Number(el('lookaheadFrames').value||10));const maxBuf=Math.max(lookahead+10,40);while(state.queue.length>maxBuf)state.queue.shift();const have=state.queue.length+(state.current?1:0);const need=lookahead+1;console.log(`[Lookahead] captured snapshot=${frame.snapshot_idx} buffer=${have}/${need}`);}

    function start(){stop();fetchOnce().catch(e=>status(`Fetch error: ${e.message}`));const ms=Math.max(250,Number(el('refreshMs').value||3000));el('refreshMs').value=String(ms);state.timer=setInterval(()=>fetchOnce().catch(e=>status(`Fetch error: ${e.message}`)),ms);}
    function stop(){if(state.timer){clearInterval(state.timer);state.timer=null;}}

    overlay.addEventListener('mousedown',(e)=>{state.view.drag=true;state.view.dx=e.clientX;state.view.dy=e.clientY;});
    window.addEventListener('mouseup',()=>{state.view.drag=false;});
    window.addEventListener('mousemove',(e)=>{if(!state.view.drag)return;const dx=e.clientX-state.view.dx,dy=e.clientY-state.view.dy;state.view.dx=e.clientX;state.view.dy=e.clientY;state.view.panX+=dx;state.view.panY+=dy;state.baseDirty=true;});
    overlay.addEventListener('wheel',(e)=>{e.preventDefault();const r=overlay.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;const oz=state.view.zoom;const nz=Math.max(.2,Math.min(12,oz*Math.exp(-e.deltaY*0.0015)));state.view.zoom=nz;const s=nz/oz;state.view.panX=mx-(mx-state.view.panX)*s;state.view.panY=my-(my-state.view.panY)*s;state.baseDirty=true;},{passive:false});

    el('startBtn').addEventListener('click',start);
    el('stopBtn').addEventListener('click',stop);
    el('resetBtn').addEventListener('click',resetView);
    el('reloadBtn').addEventListener('click',()=>fetchOnce().catch(e=>status(`Fetch error: ${e.message}`)));
    window.addEventListener('resize',resize);

    resize();
    state.raf=requestAnimationFrame(animate);
  </script>
</body>
</html>
